name: EuroNova Database Backup to Google Drive (Safe Rotation)

on:
  schedule:
    # Runs daily at 04:00 AM UTC
    - cron: '0 4 * * *'
  # Enables manual on-demand execution from GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  db-backup:
    name: Supabase Dump & Safe Google Drive Rotation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./euronova

    steps:
      - name: 🛰️ Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐘 Install PostgreSQL Client (pg_dump)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: ⚙️ Setup Node.js 20 & NPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: euronova/package-lock.json

      - name: 📦 Install googleapis
        run: npm install googleapis

      - name: 🛡️ Execute Database Backup & Safe Rotation
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node scripts/backup-db.mjs

